# Local dev only: the admin-api-tls Caddy proxy (see ../Caddyfile) terminates TLS and forwards
# plain HTTP here. This makes PHP's $_SERVER['HTTPS'] (and therefore Symfony's
# Request::isSecure(), which PrestaShop's Admin API SSL middleware checks directly) reflect
# the client's real scheme via the proxy's X-Forwarded-Proto header.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
